version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: duanarasi_web
    restart: always
    ports:
      - "${WEB_PORT:-3005}:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-duanarasi}?schema=public
      - JWT_SECRET=${JWT_SECRET:-hoom-magazine-super-secret-jwt-key-2026}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3005}
      - IMGBB_API_KEY=${IMGBB_API_KEY:-6f594898aecb2c268834c7aaf299548f}
      - NEXT_PUBLIC_IMGBB_API_KEY=${NEXT_PUBLIC_IMGBB_API_KEY:-6f594898aecb2c268834c7aaf299548f}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: duanarasi_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-duanarasi}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-duanarasi}"]
      interval: 3s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
