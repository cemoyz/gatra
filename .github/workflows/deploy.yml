name: Auto Deploy to Production Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: true
          script: |
            echo "=========================================="
            echo "🚀 Memulai Proses Auto-Deploy Dua Narasi..."
            echo "=========================================="

            # Direktori proyek di server
            PROJECT_DIR="${{ secrets.SERVER_APP_DIR || '/var/www/duanarasi.com' }}"

            if [ ! -d "$PROJECT_DIR" ]; then
              echo "⚠️ Direktori $PROJECT_DIR tidak ditemukan. Mencoba fallback ke ~/duanarasi.com..."
              PROJECT_DIR="$HOME/duanarasi.com"
            fi

            cd "$PROJECT_DIR" || exit 1
            echo "📂 Direktori aktif: $(pwd)"

            echo "📥 Mengambil update kode terbaru dari branch main..."
            git fetch origin main
            git reset --hard origin/main

            # Cek metode deployment yang digunakan di server
            if [ -f "deploy.sh" ]; then
              echo "⚙️ Menjalankan script deploy.sh lokal di server..."
              chmod +x deploy.sh
              ./deploy.sh
            elif [ -f "docker-compose.yml" ]; then
              echo "🐳 Terdeteksi Docker Compose. Memulai build & restart container..."
              docker compose up -d --build --remove-orphans

              echo "🗄️ Menjalankan migrasi database Prisma..."
              docker compose exec -T web npx prisma db push

              echo "🧹 Membersihkan image Docker lama yang tidak terpakai..."
              docker image prune -f
            elif command -v pm2 &> /dev/null; then
              echo "🖥️ Terdeteksi PM2. Memulai proses build Node.js..."
              npm ci
              npx prisma generate
              npx prisma db push
              npm run build
              pm2 reload duanarasi || pm2 restart duanarasi || pm2 start npm --name "duanarasi" -- start
              pm2 save
            else
              echo "❌ Tidak ditemukan Docker Compose maupun PM2 di server!"
              exit 1
            fi

            echo "=========================================="
            echo "🎉 Auto-Deploy Berhasil Selesai!"
            echo "=========================================="
